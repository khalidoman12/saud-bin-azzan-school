name: مزامنة أنشطة المدرسة من X

on:
  push:
    branches: [main]
    paths: ["tools/sync_x_activities.py", "tools/cache_activity_media.py", ".github/workflows/sync-x-activities.yml"]
  schedule:
    # فحص مجاني كل ساعة لتقليل احتمال فوات المنشورات من الواجهة العامة المحدودة.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-school-x-activities
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: جلب المنشورات العامة الجديدة
        run: python tools/sync_x_activities.py

      - name: حفظ صور الأخبار في الموقع
        run: python tools/cache_activity_media.py

      - name: حفظ التحديث إن وجد
        id: save
        run: |
          git add data/activities.generated.json public/activity-media/
          if git diff --cached --quiet; then
            echo "لا توجد منشورات جديدة."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "تحديث أنشطة المدرسة من X"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: نشر التحديث في GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
