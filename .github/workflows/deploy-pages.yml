name: نشر نظام البحث عن الطلبة

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات التطبيق
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: إعداد GitHub Pages
        uses: actions/configure-pages@v5

      - name: تثبيت المتطلبات
        run: npm ci

      - name: بناء النسخة المنشورة
        run: npm run build:static

      - name: تجهيز ملفات GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
